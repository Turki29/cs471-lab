{% extends "layouts/base.html" %}
{% load static %}

{% block title %} HTML5 Links Example {% endblock %}

{% block content %}
<div class="links-container">
    <h2>Styled Links Example</h2>
    <a href="https://example.com" class="my-link" id="link1">Example link 1</a><br>
    <a href="https://django.com" class="my-link" id="link2">Django link</a><br>
    <a href="https://w3schools.com" class="my-link" id="link3">W3Schools</a>
    <link rel="stylesheet" href='{% static "css/main.css" %}'>
</div>
{% endblock %}
