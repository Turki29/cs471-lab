{% extends "layouts/base.html" %}
{% block title %} Students per City {% endblock title %}
{% block content %}
    <h1>Number of Students in Each City</h1>
    <table cellpadding="8" border="1">
        <thead>
            <tr>
                <th>City</th>
                <th>Number of Students</th>
            </tr>
        </thead>
        <tbody>
            {% for city in cities %}
                <tr>
                    <td>{{ city.city }}</td>
                    <td>{{ city.student_count }}</td>
                </tr>
            {% empty %}
                <tr><td colspan="2">No cities found.</td></tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock content %}
