<h2>Edit Book</h2>

<form method="post">
    {% csrf_token %}

    <label for="title">Title:</label>
    <input type="text" name="title" id="title" value="{{ book.title }}">

    <br><br>

    <label for="price">Price:</label>
    <input type="text" name="price" id="price" value="{{ book.price }}">

    <br><br>

    <label for="publisher">Publisher:</label>
    <select name="publisher" id="publisher">
        <option value="">Select publisher</option>
        {% for publisher in publishers %}
            <option value="{{ publisher.id }}" {% if book.publisher and book.publisher.id == publisher.id %}selected{% endif %}>
                {{ publisher }}
            </option>
        {% endfor %}
    </select>

    <br><br>

    <label for="pubdate">Publication Date:</label>
    <input type="date" name="pubdate" id="pubdate" value="{{ book.pubdate|date:'Y-m-d' }}">

    <br><br>

    <label for="quantity">Quantity:</label>
    <input type="text" name="quantity" id="quantity" value="{{ book.quantity }}">

    <br><br>

    <label for="rating">Rating:</label>
    <input type="text" name="rating" id="rating" value="{{ book.rating }}">

    <br><br>

    <label for="authors">Authors:</label>
    <select name="authors" id="authors" multiple>
        {% for author in authors %}
            <option value="{{ author.id }}" {% if author in book.authors.all %}selected{% endif %}>
                {{ author }}
            </option>
        {% endfor %}
    </select>

    <br><br>

    <button type="submit">Save</button>
</form>
